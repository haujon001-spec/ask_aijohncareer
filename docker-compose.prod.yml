version: '3.8'

services:
  # Main application (backend + frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: john-career-copilot-app
    ports:
      - "3000:3000"  # Only exposed to Caddy, not publicly
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PORT: 3000
      NODE_ENV: production
    volumes:
      # Bind-mounted (same host path jd-api already mounts) so
      # buildSystemPrompt()'s per-request re-read of john_profile.json
      # actually sees live JD Portal edits, instead of the stale copy
      # baked into the image at build time.
      - ./src/data:/app/src/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - careers
    # Optional resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 512M

  # JD Automation Portal API (Node + Python pipeline) — separate image/service
  # from `app` so the already-verified chat-app container stays untouched.
  jd-api:
    build:
      context: .
      dockerfile: Dockerfile.jd-api
    container_name: john-career-copilot-jd-api
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      JD_API_PORT: 3010
      JD_PORTAL_JWT_SECRET: ${JD_PORTAL_JWT_SECRET}
      JD_PORTAL_FRONTEND_ORIGIN: ${JD_PORTAL_FRONTEND_ORIGIN}
      JD_RUN_TIMEOUT_MS: ${JD_RUN_TIMEOUT_MS:-900000}
      NODE_ENV: production
    volumes:
      # Bind mounts, not named volumes — these already hold real data on the
      # deploy host (JD blueprints, per-employer run history, profile
      # backups) that must persist across redeploys, not start empty.
      - ./data_raw:/app/data_raw
      - ./data_processed:/app/data_processed
      - ./secrets:/app/secrets
      - ./backup:/app/backup
      - ./src/data:/app/src/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3010/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - careers
    # Deliberately no `ports:` — reachable only via the `careers` network
    # (Caddy -> john-career-copilot-jd-api:3010), not published to the host.

  # Caddy reverse proxy with automatic HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: john-career-copilot-caddy
    ports:
      - "80:80"   # HTTP (auto-redirects to HTTPS)
      - "443:443" # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data     # Persist Let's Encrypt certificates
      - caddy_config:/config
    environment:
      ACME_AGREE: "true"
    restart: unless-stopped
    depends_on:
      - app
      - jd-api
    networks:
      - careers
    # Optional: custom logging
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m"
    #     max-file: "3"

networks:
  careers:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
