version: '3.8'

services:
  john-career-copilot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Load from .env.local at runtime (never commit this)
      # Docker will use these if .env.local exists at deployment
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PORT: 3000
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      careers:
        aliases:
          - app
    # Optional: Add resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    environment:
      ACME_AGREE: "true"
    networks:
      - careers
    depends_on:
      - john-career-copilot

networks:
  careers:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
